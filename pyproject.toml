
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gif7005-mammography"
version = "0.1.0"
description = "Comparaison de modèles de fondation pour la classification de mammographies"
requires-python = ">=3.10,<3.20"

dependencies = [
    # Data analysis
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "joblib",

    # Deep learning
    "torch>=2.5,<3",
    "torchvision",

    # Foundation models: DINOv2, Mammo-FM, Mammo-CLIP
    "transformers>=4.45,<5",
    "timm>=1.0.3,<2",
    "huggingface-hub",
    "safetensors",

    # Medical imaging
    "pydicom>=3.0,<4",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg>=2,<3",
    "Pillow>=9,<13",
    "opencv-python-headless>=4.8,<5",

    # Mammo-CLIP preprocessing
    "tensorboard>=2.14,<3",
    "albumentations>=1.4.7,<2",
    "imgaug==0.4.0",
    "nltk>=3.8,<4",

    # Configuration
    "omegaconf>=2.3,<3",
    "PyYAML",

    # Dataset access
    "kaggle",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools]
py-modules = []
