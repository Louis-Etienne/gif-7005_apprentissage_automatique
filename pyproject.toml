
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gif7005-mammography"
version = "0.1.0"
description = "Comparaison de modèles de fondation pour la classification de mammographies"
requires-python = ">=3.10,<3.20"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab",
    "ipykernel",
]
[tool.setuptools]
py-modules = []